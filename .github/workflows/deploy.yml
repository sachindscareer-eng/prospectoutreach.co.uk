name: Build & Deploy to Hostinger

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # give the build more heap so heavier pages don't OOM on CI
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp reconnects and resumes when Hostinger drops the data socket (the ECONNRESET
      # that kept killing FTP-Deploy-Action). Credentials come from env, not the command line.
      # TLS certificate chain IS verified; only the hostname match is skipped because the
      # server presents Hostinger's shared *.hstgr.io cert for this IP.
      # No --delete: server-only files (smtp-config.php) are left untouched.
      - name: Deploy to Hostinger via FTPS (lftp)
        env:
          FTP_HOST: 92.249.46.109
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set mirror:parallel-transfer-count 3
          mirror --reverse --verbose --no-perms --exclude-glob .git* --exclude-glob smtp-config.php ./out/ ./
          bye
          EOF
